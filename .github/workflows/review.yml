name: AI Code Review

on:
  pull_request:
    paths:
      - "**.php"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra ai

      - name: Find changed PHP files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '*.php' | head -5)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$FILES" | grep -c '.' || true)" >> $GITHUB_OUTPUT

      - name: Run AI review
        if: steps.changed.outputs.count != '0'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.5-flash
        run: |
          COMMENT="## 🔍 AI Code Review\n\n"
          TOTAL_FINDINGS=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            echo "Reviewing: $file"
            echo "Starting review of $file..."
            RESULT=$(uv run mage-audit review --json "$file" 2>&1 || echo "[]")
            echo "Review result length: ${#RESULT}"
            echo "First 200 chars: ${RESULT:0:200}"

            COUNT=$(echo "$RESULT" | python -c "import sys, json; data=json.load(sys.stdin); print(len(data))" 2>/dev/null || echo "0")

            if [ "$COUNT" -gt 0 ]; then
              TOTAL_FINDINGS=$((TOTAL_FINDINGS + COUNT))
              COMMENT+="### 📄 ${file} — ${COUNT} issue(s)\n\n"
              COMMENT+="| Severity | Line | Category | Issue | Suggestion |\n"
              COMMENT+="|----------|------|----------|-------|------------|\n"

              ROWS=$(echo "$RESULT" | python -c "
          import sys, json
          data = json.load(sys.stdin)
          for f in data:
              sev = f.get('severity', '?')
              line = f.get('line', '-')
              cat = f.get('category', '?')
              issue = f.get('issue', '').replace('|', '\\\\|').replace('\n', ' ')
              suggestion = f.get('suggestion', '').replace('|', '\\\\|').replace('\n', ' ')
              icon = {'critical': '🔴', 'error': '🟠', 'warning': '🟡', 'info': '🔵'}.get(sev, '⚪')
              print(f'| {icon} {sev} | {line} | {cat} | {issue} | {suggestion} |')
          " 2>/dev/null || echo "| ⚠️ | - | - | Failed to parse results | Check logs |")

              COMMENT+="$ROWS\n\n"
            else
              COMMENT+="### 📄 ${file} — ✅ No issues found\n\n"
            fi

            sleep 2
          done <<< "${{ steps.changed.outputs.files }}"

          if [ "$TOTAL_FINDINGS" -gt 0 ]; then
            COMMENT+="\n---\n*Found ${TOTAL_FINDINGS} issue(s). Review powered by [Mage Audit](https://github.com/Aquarvin/mage-audit).*"
          else
            COMMENT+="\n---\n*No issues found. Review powered by [Mage Audit](https://github.com/Aquarvin/mage-audit).*"
          fi

          echo -e "$COMMENT" > /tmp/review_comment.md

      - name: Post review comment
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/review_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
